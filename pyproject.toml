[project]
name = "optimaldrilling"
version = "0.1.0"
description = "Telemetry-based drilling response prediction and advisory simulator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "tqdm>=4.66",
]

[tool.uv]
package = false
